[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "octscreen"
version = "0.1.0"
requires-python = ">=3.11"
# Light, shared core: everything in octscreen/common needs only these.
dependencies = [
  "numpy",
  "pillow",
  "pandas",
  "scikit-learn",
  "omegaconf>=2.3",
  "pyyaml",
  "tqdm",
]

[dependency-groups]
dev      = ["pytest>=8"]
# Aditya's group. Abir and Poddar add theirs (optimize / app) with `uv add --group ...`
train    = ["torch>=2.3", "torchvision>=0.18", "timm>=1.0", "matplotlib"]
optimize = [
    "matplotlib>=3.10.9",
    "onnx>=1.23.2",
    "onnxruntime>=1.24.3",
    "onnxscript>=0.7.2",
    "psutil>=7.2.2",
    "py-cpuinfo>=9.0.0",
    "timm>=1.0.31",
    "torch>=2.14.1",
    "torchvision>=0.29.2",
]   # Abir fills this (see 02_Abir guide)
app      = [
    "gradio>=6.31.0",
    "huggingface-hub>=2.4.0",
    "onnxruntime>=1.23.2",
]   # Poddar fills this (see 03_Poddar guide)
app-heatmap = [
    "timm>=1.0.31",
    "torch>=2.14.1",
    "torchvision>=0.29.2",
]

[tool.uv]
default-groups = ["dev"]

# PyTorch: always take the CPU-only build on our laptops and in Docker.
# (Training happens on Kaggle/Colab, which already ship their own CUDA PyTorch.)
[tool.uv.sources]
torch       = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools.packages.find]
include = ["octscreen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
